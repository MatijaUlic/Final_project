name: CI + CD Pipeline

on:
  push:
    branches:
      - main
      - feature/mlflow-cd
  pull_request:
    branches:
      - main
      - feature/mlflow-cd

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run tests
        run: |
          PYTHONPATH=. pytest -q --disable-warnings

      - name: Lint with flake8
        run: flake8 .

      - name: Set MLFLOW_TRACKING_URI env
        run: echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> $GITHUB_ENV

      - name: Train & tune model
        run: PYTHONPATH=. python -m src.tune_and_train

      - name: Run batch prediction
        run: PYTHONPATH=. python -m src.predict

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/best_model.pkl

      - name: Upload batch results
        uses: actions/upload-artifact@v4
        with:
          name: batch-prediction-results
          path: batch_prediction_dataset/results.csv

      - name: Upload prediction report
        uses: actions/upload-artifact@v4
        with:
          name: batch-prediction-report
          path: batch_prediction_dataset/report.txt
